name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Compile and Sign APK
        run: |
          sudo apt-get update
          sudo apt-get install -y ecj dx aapt zip apksigner wget
          mkdir -p ~/.android build_out classes_temp
          wget -O ~/.android/android.jar https://github.com/Sable/android-platforms/raw/master/android-34/android.jar
          find . -name "*.java" > sources.txt
          ecj -cp ~/.android/android.jar -d classes_temp @sources.txt
          dx --dex --output=build_out/classes.dex $(find classes_temp -name "*.class")
          cd build_out
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.wave.app"><application android:label="Wave App"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > AndroidManifest.xml
          aapt package -f -M AndroidManifest.xml -I ~/.android/android.jar -F FreshWave.apk
          zip -u FreshWave.apk classes.dex
          keytool -genkey -v -keystore key.jks -alias alias -keyalg RSA -keysize 2048 -validity 10000 -passin pass:password -passout pass:password
          apksigner sign --ks key.jks --ks-pass pass:password FreshWave.apk
          
      - uses: actions/upload-artifact@v4
        with:
          name: FreshWave
          path: build_out/FreshWave.apk
