name: Compile and Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ecj dx aapt zipalign apksigner wget

    - name: Download Android SDK Stubs
      run: |
        mkdir -p ~/.android
        wget -O ~/.android/android.jar https://github.com/Sable/android-platforms/raw/master/android-34/android.jar

    - name: Compile Java & Build APK
      run: |
        # Create output directory
        mkdir -p build_out
        cd app/src/main/java/

        # 1. Compile Java files
        ecj -cp ~/.android/android.jar com/wave/app/*.java

        # 2. Convert to DEX
        dx --dex --output=../../../build_out/classes.dex com/wave/app/*.class
        cd ../../../build_out

        # 3. Create basic APK container with AndroidManifest
        cp ../app/src/main/AndroidManifest.xml AndroidManifest.xml
        
        # Build raw APK using aapt
        aapt package -f -M AndroidManifest.xml -I ~/.android/android.jar -F FreshWave.unaligned.apk
        zip -u FreshWave.unaligned.apk classes.dex

        # 4. Generate Keystore & Sign APK
        keytool -genkey -v -keystore release-key.jks -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 -passin pass:password -passout pass:password
        apksigner sign --ks release-key.jks --ks-pass pass:password FreshWave.unaligned.apk
        mv FreshWave.unaligned.apk FreshWave.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FreshWave
        path: build_out/FreshWave.apk
