name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: |
        # If you don't have a gradle wrapper yet, this fallback handles basic builds, 
        # or standard Android Studio projects compile via ./gradlew assembleDebug
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          echo "Please ensure a Gradle wrapper is included in your repo structure."
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
